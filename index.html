<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AxiomPhysics - Высшая физика и космология</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #070b14;
            --card-bg: #111827;
            --border: #1f293d;
            --text: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container { width: 100%; max-width: 560px; }
        header { text-align: center; margin-bottom: 24px; }
        h1 { font-size: 24px; margin: 0 0 4px 0; color: var(--primary); }
        .subtitle { font-size: 13px; color: var(--text-secondary); }
        
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        
        .btn {
            display: block; width: 100%; padding: 14px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
            cursor: pointer; text-align: center; margin-bottom: 12px;
            transition: background 0.2s; box-sizing: border-box;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn-secondary { background-color: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover { background-color: rgba(255,255,255,0.05); }
        .btn-warning { background-color: var(--warning); color: #000; font-weight: bold; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab-btn {
            flex: 1; padding: 10px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border); border-radius: 8px; color: var(--text-secondary);
            font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
        }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        .section-box {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .option-btn {
            display: block; width: 100%; padding: 12px 16px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border);
            border-radius: 12px; color: var(--text); font-size: 14px;
            cursor: pointer; text-align: left; margin-bottom: 10px;
            transition: all 0.2s; box-sizing: border-box;
        }
        .option-btn:hover { background: rgba(255,255,255,0.08); border-color: var(--primary); }
        .option-btn.correct { background: rgba(16, 185, 129, 0.2); border-color: var(--accent); color: #6ee7b7; font-weight: bold; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: #fca5a5; }

        .badge { display: inline-block; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: bold; margin-bottom: 12px; background: rgba(99, 102, 241, 0.2); color: #818cf8; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>AxiomPhysics ⚛️</h1>
        <div class="subtitle">Высшая физика, полевые структуры и космология</div>
    </header>

    <!-- Главная: список тем -->
    <div id="screen-home" class="card">
        <h2 style="margin-top:0; font-size:18px;">Выберите раздел науки</h2>
        <div class="subtitle" style="margin-bottom: 16px;">Теория с первых принципов, глубокий смысл и тренажер для прокачки мышления.</div>
        
        <button class="btn" onclick="openTopic('lagrange')">1. Аналитическая механика (Лагранжиан)</button>
        <button class="btn" onclick="openTopic('schrodinger')">2. Квантовая механика (Уравнение Шредингера)</button>
        <button class="btn" onclick="openTopic('maxwell')">3. Электродинамика (Уравнения Максвелла)</button>
        <button class="btn" onclick="openTopic('statphys')">4. Статистическая физика (Распределение Гиббса)</button>
        <button class="btn btn-warning" onclick="openTopic('astrophysics')">5. Астрофизика (ОТО и Черные дыры)</button>
    </div>

    <!-- Экран изучения темы -->
    <div id="screen-topic" class="card hidden">
        <span class="badge" id="topic-badge">Раздел</span>
        <h2 id="topic-title" style="margin-top:0; font-size:18px; color: var(--warning);"></h2>

        <!-- Переключатель вкладок -->
        <div class="tabs">
            <div class="tab-btn active" onclick="switchTab('theory')">📚 Конспект</div>
            <div class="tab-btn" onclick="switchTab('explanation')">💡 Смысл</div>
            <div class="tab-btn" onclick="switchTab('trainer')">🎯 Тренажер</div>
        </div>

        <!-- Контент вкладки: Конспект -->
        <div id="tab-theory" class="section-box">
            <div id="content-theory"></div>
        </div>

        <!-- Контент вкладки: Объяснение (Смысл) -->
        <div id="tab-explanation" class="section-box hidden">
            <div id="content-explanation"></div>
        </div>

        <!-- Контент вкладки: Тренажер -->
        <div id="tab-trainer" class="section-box hidden">
            <div id="content-task" style="font-weight: 500; margin-bottom: 14px;"></div>
            <div id="content-options"></div>
            <div id="content-feedback" class="section-box hidden" style="margin-top: 12px; background: rgba(16, 185, 129, 0.1); border-color: var(--accent);"></div>
        </div>

        <button class="btn btn-secondary" onclick="goHome()" style="margin-top: 16px;">← К списку разделов</button>
    </div>
</div>

<script>
// Полная база данных по высшей физике и астрофизике
const physicsData = {
    lagrange: {
        badge: "Аналитическая механика",
        title: "Принцип наименьшего действия и Лагранжиан",
        theory: "<b>Формализм Лагранжа:</b> Вместо громоздких векторных сил Ньютона, аналитическая механика использует скалярные функции системы.<br><br>• <b>Лагранжиан L</b> определяется как разность кинетической (T) и потенциальной (U) энергии: <i>L = T - U</i>.<br><br>• <b>Принцип Гамильтона:</b> Реальная траектория движения системы всегда минимизирует функционал действия <i>S = ∫ L dt</i>.<br><br>• <b>Уравнение Эйлера-Лагранжа:</b> <i>d/dt (∂L/∂v) - ∂L/∂q = 0</i>.",
        explanation: "<b>В чем глубокий смысл?</b> Природа устроена элегантно и «лениво». Свет выбирает путь с минимальным временем, а механические системы двигаются так, чтобы интеграл действия был экстремальным. Это позволяет решать сложнейшие задачи в любых координатах без поиска сил реакций.",
        task: "Какая физическая величина минимизируется на истинной траектории движения согласно принципу наименьшего действия?",
        options: ["Полная механическая энергия", "Функционал действия S", "Импульс системы p", "Кинетическая энергия T"],
        correct: 1,
        hint: "Действие S — это интеграл от Лагранжиана по времени, и именно оно принимает экстремальное (минимальное) значение."
    },
    schrodinger: {
        badge: "Квантовая механика",
        title: "Волновая функция и уравнение Шредингера",
        theory: "<b>Постулаты волновой механики:</b> Состояние квантовой системы описывается волновой функцией <i>Ψ(r, t)</i>.<br><br>• <b>Смысл волновой функции (Борн):</b> Квадрат модуля <i>|Ψ|²</i> определяет плотность вероятности обнаружения частицы в точке.<br><br>• <b>Стационарное уравнение Шредингера:</b> <i>HΨ = EΨ</i>, где H — оператор Гамильтона (полная энергия).",
        explanation: "<b>В чем глубокий смысл?</b> В микромире у частиц нет жестких классических траекторий. Они распределены в пространстве в виде волн вероятности. Уравнение Шредингера управляет эволюцией этой волны во времени до момента измерения.",
        task: "Что физически означает квадрат модуля волновой функции |Ψ|² в квантовой механике?",
        options: ["Плотность вероятности обнаружения частицы", "Точную скорость электрона", "Полную массу системы", "Силу притяжения ядра"],
        correct: 0,
        hint: "По статистической интерпретации Макса Борна, вероятность найти частицу в пространстве пропорциональна |Ψ|²."
    },
    maxwell: {
        badge: "Электродинамика полей",
        title: "Уравнения Максвелла в дифференциальной форме",
        theory: "<b>Фундамент классического поля:</b> Все электрические и магнитные явления описываются четырьмя уравнениями:<br><br>1. <i>div(E) = ρ / ε₀</i> (Заряды — источники электрополя).<br>2. <i>div(B) = 0</i> (Магнитные монополи отсутствуют).<br>3. <i>rot(E) = -∂B/∂t</i> (Закон Фарадея: переменное магнитное поле рождает вихревое электрическое).<br>4. <i>rot(B) = μ₀j + μ₀ε₀(∂E/∂t)</i> (Токи и переменное электрополе рождают магнитное).",
        explanation: "<b>В чем глубокий смысл?</b> Максвелл объединил электричество, магнетизм и оптику. Из этих уравнений математически следует, что свет — это самораспространяющаяся электромагнитная волна с неизменной скоростью в вакууме.",
        task: "Какое из уравнений Максвелла указывает на замкнутость магнитных линий и отсутствие монополей?",
        options: ["div(E) = ρ / ε₀", "div(B) = 0", "rot(E) = -∂B/∂t", "rot(B) = μ₀j"],
        correct: 1,
        hint: "Дивергенция магнитного поля равна нулю (div(B) = 0), что доказывает отсутствие изолированных магнитных зарядов."
    },
    statphys: {
        badge: "Статистическая физика",
        title: "Каноническое распределение Гиббса",
        theory: "<b>Вероятностный подход:</b> В макросистемах с числом частиц порядка $10^{23}$ точное решение механики невозможно.<br><br>• <b>Распределение Гиббса:</b> Вероятность нахождения системы в состоянии с энергией E пропорциональна <i>w ~ exp(-E / kT)</i>, где T — температура.<br><br>• <b>Статистическая сумма (Зустат):</b> <i>Z = ∑ exp(-E_i / kT)</i>.",
        explanation: "<b>В чем глубокий смысл?</b> Температура — это мера хаотичного теплового движения. Распределение Гиббса объясняет, как микроскопический хаос формирует макроскопические законы термодинамики.",
        task: "Какой параметр входит в показатель экспоненты распределения Гиббса наряду с энергией состояния?",
        options: ["Масса частиц", "Абсолютная температура T", "Внешнее давление", "Скорость света"],
        correct: 1,
        hint: "Вероятность состояния зависит от температуры T через отношение энергии к тепловой энергии kT."
    },
    astrophysics: {
        badge: "Астрофизика и космология",
        title: "Общая теория относительности и черные дыры",
        theory: "<b>Геометрическая гравитация:</b> Эйнштейн доказал, что гравитация — это не силовое притяжение, а искривление четырехмерного пространства-времени массивными телами.<br><br>• <b>Радиус Шварцшильда ($r_s$):</b> Радиус, при сжатии массы до которого вторая космическая скорость достигает скорости света: <i>r_s = 2GM / c²</i>.<br><br>• <b>Горизонт событий:</b> Граница черной дыры, из-под которой не может вырваться даже свет.",
        explanation: "<b>В чем глубокий смысл?</b> Масса говорит пространству, как искривляться, а искривленное пространство говорит массе, как двигаться. Черные дыры — это экстремальные объекты, где искривление пространства становится бесконечным, разрывая привычную причинность.",
        task: "Что является причиной гравитационного притяжения масс согласно Общей теории относительности (ОТО)?",
        options: ["Искривление геометрии пространства-времени", "Обмен виртуальными фотонами", "Магнитное поле ядра планеты", "Электростатическое отталкивание вакуума"],
        correct: 0,
        hint: "В ОТО гравитация трактуется не как ньютоновская сила, а как геометрия искривленного массивными телами пространства-времени."
    }
};

let currentTopicKey = '';

function openTopic(key) {
    currentTopicKey = key;
    const data = physicsData[key];

    document.getElementById('topic-badge').innerText = data.badge;
    document.getElementById('topic-title').innerText = data.title;
    
    document.getElementById('content-theory').innerHTML = data.theory;
    document.getElementById('content-explanation').innerHTML = data.explanation;
    
    setupTrainer(data);
    switchTab('theory');

    document.getElementById('screen-home').classList.add('hidden');
    document.getElementById('screen-topic').classList.remove('hidden');
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('tab-theory').classList.add('hidden');
    document.getElementById('tab-explanation').classList.add('hidden');
    document.getElementById('tab-trainer').classList.add('hidden');

    if (tabName === 'theory') {
        document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
        document.getElementById('tab-theory').classList.remove('hidden');
    } else if (tabName === 'explanation') {
        document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
        document.getElementById('tab-explanation').classList.remove('hidden');
    } else if (tabName === 'trainer') {
        document.querySelector('.tab-btn:nth-child(3)').classList.add('active');
        document.getElementById('tab-trainer').classList.remove('hidden');
    }
}

function setupTrainer(data) {
    document.getElementById('content-task').innerText = data.task;
    document.getElementById('content-feedback').classList.add('hidden');
    
    const container = document.getElementById('content-options');
    container.innerHTML = '';

    let indices = [0, 1, 2, 3];
    indices.sort(() => Math.random() - 0.5);

    indices.forEach(i => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = data.options[i];
        btn.onclick = () => checkAnswer(i, data.correct, data.hint);
        container.appendChild(btn);
    });
}

function checkAnswer(chosen, correct, hint) {
    const allBtns = document.querySelectorAll('#content-options .option-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');

    allBtns.forEach((b) => {
        if (b.innerText === physicsData[currentTopicKey].options[correct]) {
            b.classList.add('correct');
        }
    });

    if (chosen !== correct) {
        event.target.classList.add('wrong');
    }

    const feedback = document.getElementById('content-feedback');
    feedback.innerHTML = `<b>💡 Физический разбор:</b><br>${hint}`;
    feedback.classList.remove('hidden');
}

function goHome() {
    document.getElementById('screen-topic').classList.add('hidden');
    document.getElementById('screen-home').classList.remove('hidden');
}
</script>
</body>
</html>
